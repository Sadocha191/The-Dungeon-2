name: Preserve Legacy movement parity

on:
  push:
    branches:
      - feat/switchable-npc-movement-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/switchable-npc-movement-v2
          fetch-depth: 0
      - run: python tools/preserve_legacy_movement_costs.py
      - run: |
          git diff --check
          grep -q 'ConstrainPosition(npc, nextPos, now, impulseMove)' Level/ServerScriptService/ModuleScript/NpcService.lua
          grep -q 'if entry.movementMode == "Surface" then' Level/StarterPlayer/StarterPlayerScripts/LocalScript/NpcPresentation.client.lua
      - run: |
          rm -f tools/preserve_legacy_movement_costs.py
          rm -f .github/workflows/preserve-legacy-movement-costs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve Legacy movement behavior and client cost"
          git push origin HEAD:feat/switchable-npc-movement-v2
