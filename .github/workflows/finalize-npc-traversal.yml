name: Finalize NPC traversal validation

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply final review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          navigation_path = "Level/ServerScriptService/ModuleScript/NpcGroundNavigation.lua"
          replace_once(
              navigation_path,
              '''local function partTopY(part: BasePart): number\n\tlocal half = part.Size * 0.5\n\tlocal highest = -math.huge\n\tfor _, x in ipairs({ -half.X, half.X }) do\n\t\tfor _, y in ipairs({ -half.Y, half.Y }) do\n\t\t\tfor _, z in ipairs({ -half.Z, half.Z }) do\n\t\t\t\thighest = math.max(highest, part.CFrame:PointToWorldSpace(Vector3.new(x, y, z)).Y)\n\t\t\tend\n\t\tend\n\tend\n\treturn highest\nend''',
              '''local function partTopY(part: BasePart): number\n\tlocal half = part.Size * 0.5\n\tlocal cframe = part.CFrame\n\tlocal verticalExtent = math.abs(cframe.RightVector.Y) * half.X\n\t\t+ math.abs(cframe.UpVector.Y) * half.Y\n\t\t+ math.abs(cframe.LookVector.Y) * half.Z\n\treturn part.Position.Y + verticalExtent\nend''',
          )

          surface_path = "Level/ServerScriptService/ModuleScript/NpcGroundSurface.lua"
          replace_once(
              surface_path,
              '''\tlocal liftedStart = Vector3.new(startCenter.X, clearanceCenterY, startCenter.Z)\n\tlocal liftedEnd = Vector3.new(centerSample.position.X, clearanceCenterY, centerSample.position.Z)\n\tlocal hit = traversalCast(startCenter, liftedStart, size)\n\tif not hit then\n\t\thit = traversalCast(liftedStart, liftedEnd, size)\n\tend\n\tif hit then''',
              '''\tlocal liftedStart = Vector3.new(startCenter.X, clearanceCenterY, startCenter.Z)\n\tlocal liftedEnd = Vector3.new(centerSample.position.X, clearanceCenterY, centerSample.position.Z)\n\tlocal endCenter = bodyCenter(centerSample, profile)\n\tlocal hit = traversalCast(startCenter, liftedStart, size)\n\tif not hit then\n\t\thit = traversalCast(liftedStart, liftedEnd, size)\n\tend\n\tif not hit then\n\t\thit = traversalCast(liftedEnd, endCenter, size)\n\tend\n\tif hit then''',
          )

          for path in ["docs/changelog/CHANGELOG_AI_2026-07.md"]:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              old = "at most two traversal `Blockcast` calls"
              if text.count(old) != 1:
                  raise RuntimeError(f"{path}: expected Blockcast cost text")
              file_path.write_text(text.replace(old, "at most three traversal `Blockcast` calls", 1), encoding="utf-8")

          Path(".github/workflows/finalize-npc-traversal.yml").unlink()
          PY

          git diff --check
          grep -q 'local endCenter = bodyCenter(centerSample, profile)' Level/ServerScriptService/ModuleScript/NpcGroundSurface.lua
          grep -q 'traversalCast(liftedEnd, endCenter, size)' Level/ServerScriptService/ModuleScript/NpcGroundSurface.lua
          ! grep -q 'for _, x in ipairs' Level/ServerScriptService/ModuleScript/NpcGroundNavigation.lua

      - name: Commit final review fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate NPC traversal landing clearance"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
