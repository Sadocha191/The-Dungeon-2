name: Finalize NPC movement integration

on:
  push:
    branches:
      - feat/switchable-npc-movement-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/switchable-npc-movement-v2
          fetch-depth: 0
      - run: python tools/finalize_npc_movement_integration.py
      - run: |
          git diff --check
          grep -q 'NpcCombatBehaviorService.Pause(npc, dt)' Level/ServerScriptService/ModuleScript/NpcService.lua
          grep -q 'movementSystem = cfg.movementSystem' Level/ServerScriptService/Script/Model/WaveController.lua
          grep -q 'function LeapExplodeBehavior.Pause' Level/ServerScriptService/ModuleScript/LeapExplodeBehavior.lua
      - run: |
          rm -f tools/finalize_npc_movement_integration.py
          rm -f .github/workflows/finalize-npc-movement-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize NPC movement behavior integration"
          git push origin HEAD:feat/switchable-npc-movement-v2
