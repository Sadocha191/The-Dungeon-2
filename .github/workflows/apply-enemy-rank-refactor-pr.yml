name: Apply enemy rank refactor from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/enemy-ranks-resistances-reward-chests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Check patch readiness
        id: gate
        shell: bash
        run: |
          if [ -f .github/patches/enemy-rank-refactor.ready ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply guarded repository patch
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, subprocess, sys
          parts = sorted(Path('.github/patches').glob('enemy-rank-refactor.part*.txt'))
          payload = ''.join(part.read_text().strip() for part in parts)
          expected = '6bdb085a685c5e3486f704afce4afb502a9dfd7e9e58f346f213307e00f3bfdb'
          actual = hashlib.sha256(payload.encode()).hexdigest()
          if actual != expected:
              raise SystemExit(f'Patch payload hash mismatch: {actual}')
          target = Path('/tmp/patch_enemy_rank_refactor.py')
          target.write_bytes(gzip.decompress(base64.b64decode(payload, validate=True)))
          subprocess.run([sys.executable, str(target)], check=True)
          PY
      - name: Commit refactor
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Implement enemy ranks, resistances, and reward chests'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
