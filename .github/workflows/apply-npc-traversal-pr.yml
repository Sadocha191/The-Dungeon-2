name: Apply NPC traversal patch from pull request

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute embedded patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          import traceback

          try:
              source = Path('.github/workflows/apply-npc-obstacle-traversal.yml').read_text(encoding='utf-8')
              marker = "          python3 - <<'PY'\n"
              start = source.index(marker) + len(marker)
              end = source.index("\n          PY\n", start)
              script = textwrap.dedent(source[start:end])
              exec(compile(script, 'apply_npc_obstacle_traversal.py', 'exec'), {})
              Path('.github/workflows/apply-npc-traversal-pr.yml').unlink(missing_ok=True)
          except Exception:
              Path('.github/patch-error.txt').write_text(traceback.format_exc(), encoding='utf-8')
          PY

          if test -f .github/patch-error.txt; then
            cat .github/patch-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/patch-error.txt
            git commit -m "Record NPC traversal patch failure"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            exit 1
          fi

          git diff --check
          grep -q 'TraversalKind = "Hop"' Level/ServerScriptService/ModuleScript/NpcNavigationConfig.lua
          grep -q 'TraversalKind = "Stride"' Level/ServerScriptService/ModuleScript/NpcNavigationConfig.lua
          grep -q 'function NpcGroundSurface.ValidateTraversal' Level/ServerScriptService/ModuleScript/NpcGroundSurface.lua
          grep -q 'local function stepTraversal' Level/ServerScriptService/ModuleScript/NpcGroundNavigation.lua

      - name: Commit generated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve NPC obstacle traversal"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
