name: Apply enemy rank refactor

on:
  push:
    branches:
      - feature/enemy-ranks-resistances-reward-chests

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Bootstrap enemy rank refactor automation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/enemy-ranks-resistances-reward-chests
          fetch-depth: 0
      - name: Apply guarded repository patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/patch_enemy_rank_refactor.py
          python /tmp/patch_enemy_rank_refactor.py
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Implement enemy ranks, resistances, and reward chests'
          git push origin HEAD:feature/enemy-ranks-resistances-reward-chests
